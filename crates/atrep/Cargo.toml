[package]
name = "atrep"
description = "Atrep extensible semantic markup: parser, dendron (AST), dialektoi, kanonizo, litosis"
keywords = ["atrep", "markup", "semantic", "document", "dialect"]
categories = ["text-processing", "parser-implementations"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# net: remote resource fetching (ureq). bundle: .atk.tar.gz
# archive output (tar/flate2). Disable both for wasm targets.
default = ["net", "bundle"]
net = ["dep:ureq"]
bundle = ["dep:tar", "dep:flate2"]

[dependencies]
unicode-normalization.workspace = true
sha2.workspace = true
ureq = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
